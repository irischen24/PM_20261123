<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2563EB;--primary-50:#EFF6FF;--primary-100:#DBEAFE;--navy:#0F172A;--bg:#F8FAFC;--card:#FFFFFF;
  --text:#0F172A;--text-2:#475569;--muted:#64748B;--border:#E2E8F0;--hover:#F1F5F9;
  --success:#10B981;--success-ink:#047857;--success-bg:#D1FAE5;--warning:#F59E0B;--warning-ink:#B45309;--warning-bg:#FEF3C7;
  --danger:#EF4444;--danger-ink:#B91C1C;--danger-bg:#FEE2E2;--info-bg:#DBEAFE;--info-ink:#1D4ED8;
  --radius:14px;--radius-sm:10px;--shadow:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
  --sidebar-w:240px;--topbar-h:64px;
  --font:'Inter','Noto Sans TC',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;
  --s1:#2563EB;--s2:#EB6834;--s3:#1BAF7A;--s4:#EDA100;--s5:#E87BA4;--s6:#008300;--s7:#6250D6;--s8:#E34948;
  --chart-grid:#EEF2F7;--chart-axis:#64748B;--chart-baseline:#94A3B8;
}
[data-theme="dark"]{
  --primary:#3B82F6;--primary-50:#172554;--primary-100:#1E3A8A;--bg:#0B1220;--card:#111A2E;--text:#E2E8F0;--text-2:#CBD5E1;--muted:#94A3B8;
  --border:#1E293B;--hover:#18233A;--success-bg:#064E3B;--success-ink:#6EE7B7;--warning-bg:#78350F;--warning-ink:#FCD34D;--danger-bg:#7F1D1D;--danger-ink:#FCA5A5;
  --info-bg:#1E3A8A;--info-ink:#BFDBFE;--shadow:none;
  --s1:#3B82F6;--s2:#D95926;--s3:#199E70;--s4:#C98500;--s5:#D55181;--s6:#0CA30C;--s7:#9085E9;--s8:#E66767;
  --chart-grid:#1E293B;--chart-axis:#94A3B8;--chart-baseline:#64748B;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--card);border-right:1px solid var(--border);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;transition:width .2s}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 12px;font-weight:700;font-size:17px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--primary);display:grid;place-items:center;color:#fff}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.nav{flex:1;overflow-y:auto;padding:4px 10px 16px}
.nav-section{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--text-2);text-align:left;min-height:38px;position:relative}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item[aria-current="page"]{background:var(--primary-50);color:var(--primary);font-weight:600}
.nav-item[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--primary)}
.nav-item svg{flex:0 0 18px}
.nav-item .label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--primary);color:#fff;font-size:11px;font-weight:600;display:inline-grid;place-items:center}
.badge.danger{background:var(--danger)}.badge.warn{background:var(--warning-ink)}
.sidebar.collapsed{width:72px;flex-basis:72px}
.sidebar.collapsed .label,.sidebar.collapsed .nav-section,.sidebar.collapsed .brand-text,.sidebar.collapsed .nav-item .badge{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--topbar-h);display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.topbar h1{font-size:18px;margin:0;font-weight:600;white-space:nowrap}
.search{flex:1;max-width:380px;margin-left:auto;position:relative}
.search input{width:100%;height:40px;border:1px solid var(--border);border-radius:10px;background:var(--bg);padding:0 12px 0 36px}
.search svg{position:absolute;left:11px;top:11px;color:var(--muted)}
.icon-btn{width:40px;height:40px;border:1px solid var(--border);background:var(--card);border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--text-2);position:relative}
.icon-btn:hover{background:var(--hover)}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--card)}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid var(--border);border-radius:24px;background:var(--card)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--primary-100);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:12px}
.user-chip small{display:block;color:var(--muted);font-size:11px;line-height:1.1}
.content{padding:24px;max-width:1600px;width:100%;margin:0 auto}
.menu-toggle{display:none}

/* Grid & cards */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.col-12{grid-column:span 12}.col-9{grid-column:span 9}.col-8{grid-column:span 8}.col-7{grid-column:span 7}.col-6{grid-column:span 6}.col-5{grid-column:span 5}.col-4{grid-column:span 4}.col-3{grid-column:span 3}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-width:0}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-h h2,.card-h h3{font-size:15px;font-weight:600;margin:0}
.card-h .sub{color:var(--muted);font-size:12px}
.card-h .spacer{flex:1}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{padding:16px}
.kpi .k-label{font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:6px}
.kpi .k-icon{width:30px;height:30px;border-radius:9px;background:var(--hover);display:grid;place-items:center;color:var(--text-2)}
.kpi .k-value{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1.15}
.kpi .k-value small{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.kpi .k-foot{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.clickable{cursor:pointer;text-align:left;width:100%;font:inherit}
.kpi.clickable:hover{border-color:var(--primary)}
.greeting{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.greeting h2{font-size:22px;margin:0;font-weight:700}
.greeting .meta{color:var(--muted);font-size:13px}
.greeting .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* Controls */
.btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.danger{color:var(--danger-ink);border-color:var(--danger-bg)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--text-2);font-weight:500}
.field .req{color:var(--danger-ink)}
.input,select.input,textarea.input{height:38px;border:1px solid var(--border);border-radius:10px;background:var(--card);padding:0 10px;width:100%}
textarea.input{height:auto;min-height:80px;padding:8px 10px;resize:vertical}
.input[aria-invalid="true"]{border-color:var(--danger)}
.field .err{color:var(--danger-ink);font-size:12px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filters .field{width:auto}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:0 12px;height:34px;cursor:pointer;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--primary-50);color:var(--primary);font-weight:600}

/* Status pill: color + icon + text (never color alone) */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--hover);color:var(--text-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--success-bg);color:var(--success-ink)}
.pill.warn{background:var(--warning-bg);color:var(--warning-ink)}
.pill.bad{background:var(--danger-bg);color:var(--danger-ink)}
.pill.info{background:var(--info-bg);color:var(--info-ink)}
.health{display:flex;align-items:center;gap:14px}
.health-ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:6px solid var(--border)}
.health-ring.Green{border-color:var(--success);color:var(--success-ink)}
.health-ring.Yellow{border-color:var(--warning);color:var(--warning-ink)}
.health-ring.Red{border-color:var(--danger);color:var(--danger-ink)}
.dim{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--border);font-size:13px}
.dim:first-child{border-top:0}
.dim b{min-width:70px}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--border)}
.li:first-child{border-top:0}
.li .t{font-weight:500}
.li .s{color:var(--muted);font-size:12px}
.li .grow{flex:1;min-width:0}
.li-btn{all:unset;display:flex;gap:10px;width:100%;cursor:pointer;border-radius:8px}
.li-btn:focus-visible{outline:2px solid var(--primary)}
.date-badge{width:44px;flex:0 0 44px;text-align:center;border:1px solid var(--border);border-radius:10px;padding:4px 0;line-height:1.1}
.date-badge b{display:block;font-size:16px}
.date-badge span{font-size:11px;color:var(--muted)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.empty svg{color:var(--border);margin-bottom:6px}
.notice{padding:10px 12px;border-radius:10px;background:var(--info-bg);color:var(--info-ink);font-size:13px;margin-bottom:12px}
.notice.warn{background:var(--warning-bg);color:var(--warning-ink)}
.notice.bad{background:var(--danger-bg);color:var(--danger-ink)}
.progress{height:6px;background:var(--hover);border-radius:6px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--primary);border-radius:6px}

/* Charts */
.chart-box{position:relative;height:280px}
.chart-box.sm{height:220px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block}
.legend i.sq{height:10px;width:10px;border-radius:3px}
.legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)!important}
.stat-row{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:10px}
.stat-row div{font-size:12px;color:var(--muted)}
.stat-row b{display:block;font-size:18px;color:var(--text)}
.heatmap{display:grid;grid-template-columns:28px repeat(5,1fr);gap:4px;font-size:12px}
.heatmap .ax{display:grid;place-items:center;color:var(--muted)}
.cell{height:44px;border-radius:8px;border:0;display:grid;place-items:center;font-weight:700;cursor:pointer;color:#0F172A}
.cell.l{background:#DCFCE7}.cell.m{background:#FEF3C7}.cell.h{background:#FED7AA}.cell.c{background:#FECACA}
.cell.zero{color:transparent}
.cell:hover{outline:2px solid var(--primary)}
[data-theme="dark"] .cell{filter:brightness(.85)}
.evm{width:100%;border-collapse:collapse;font-size:13px}
.evm td{padding:6px 4px;border-top:1px solid var(--border)}
.evm td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* Timeline */
.tl{display:flex;flex-direction:column;gap:8px}
.tl-row{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;font-size:12px}
.tl-track{position:relative;height:26px;background:var(--hover);border-radius:8px}
.tl-bar{position:absolute;top:3px;height:20px;border-radius:6px;background:var(--primary-100);border-left:3px solid var(--primary);padding:0 6px;font-size:11px;line-height:20px;overflow:hidden;white-space:nowrap;color:var(--info-ink)}
.tl-bar.Delayed{background:var(--danger-bg);border-color:var(--danger);color:var(--danger-ink)}
.tl-bar.Completed{background:var(--success-bg);border-color:var(--success);color:var(--success-ink)}

/* Table */
.table-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm)}
table.data{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
table.data th{position:sticky;top:0;background:var(--bg);text-align:left;font-weight:600;color:var(--text-2);padding:10px;border-bottom:1px solid var(--border);white-space:nowrap}
table.data th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
table.data td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;max-width:320px}
table.data tr:hover td{background:var(--hover)}
table.data td.num{text-align:right;font-variant-numeric:tabular-nums}
table.data td .clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
table.data select.inline{height:30px;border:1px solid transparent;background:transparent;border-radius:8px;padding:0 4px;max-width:150px}
table.data select.inline:hover,table.data select.inline:focus{border-color:var(--border);background:var(--card)}
.cards-view{display:none;flex-direction:column;gap:10px}
.rcard{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--card);text-align:left;width:100%;cursor:pointer}
.rcard .kv{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:2px 0}
.rcard .kv span:first-child{color:var(--muted)}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:12px;color:var(--muted);font-size:13px}
.tree-indent{display:inline-block}
.col-menu{position:absolute;z-index:30;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.12);padding:8px;max-height:320px;overflow:auto;min-width:220px}
.col-menu label{display:flex;gap:8px;padding:4px 6px;font-size:13px;cursor:pointer}

/* Modal & toast */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:760px;box-shadow:0 20px 50px rgba(15,23,42,.25)}
.modal.sm{max-width:440px}
.modal-h{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-h h2{font-size:16px;margin:0;flex:1}
.modal-b{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-b .full{grid-column:1 / -1}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border)}
.modal-f .left{margin-right:auto}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--navy);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.2);max-width:360px;display:flex;gap:8px}
.toast.err{background:#7F1D1D}.toast.ok{background:#065F46}
.skeleton{background:linear-gradient(90deg,var(--hover) 25%,var(--border) 37%,var(--hover) 63%);background-size:400% 100%;animation:sk 1.2s ease infinite;border-radius:10px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.backdrop{display:none}

/* Responsive */
@media (max-width:1280px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.col-3{grid-column:span 6}.col-4{grid-column:span 6}.col-8,.col-9,.col-7,.col-5{grid-column:span 12}}
@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .sidebar.open{transform:none}
  .sidebar.collapsed{width:var(--sidebar-w)}
  .backdrop.show{display:block;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:50}
  .menu-toggle{display:grid}
  .collapse-btn{display:none}
  .search{display:none}
  .grid > [class*="col-"]{grid-column:span 12}
  .content{padding:16px}
}
@media (max-width:640px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi .k-value{font-size:22px}
  .topbar{padding:0 12px}.topbar h1{font-size:16px}
  .user-chip .who{display:none}
  .modal-b{grid-template-columns:1fr}
  .table-wrap{display:none}.cards-view{display:flex}
  .tl-row{grid-template-columns:1fr}
  .chart-box{height:240px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

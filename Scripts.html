/* ------------------------------ API ------------------------------ */
function api(method, ...args) {
  return new Promise((resolve, reject) => {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      reject({ code: 'NO_BACKEND', message: '此頁面需由 Google Apps Script Web App 開啟才能連接資料。' });
      return;
    }
    google.script.run
      .withSuccessHandler(res => {
        if (!res) return reject({ code: 'EMPTY', message: '伺服器沒有回應資料' });
        if (res.ok) resolve(res.data); else reject(res.error || { code: 'UNKNOWN', message: '未知錯誤' });
      })
      .withFailureHandler(err => reject({ code: 'NETWORK', message: (err && err.message) || '網路或伺服器錯誤' }))[method](...args);
  });
}

/* ------------------------------ UI primitives ------------------------------ */
function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.innerHTML = esc(msg);
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), kind === 'err' ? 7000 : 3500);
}
function errMsg(e) {
  if (!e) return '未知錯誤';
  if (e.code === 'CONFLICT') return '儲存衝突：' + e.message;
  return e.message || String(e);
}
function emptyState(text, icon) { return `<div class="empty">${svg(icon || 'inbox', 32)}<div>${esc(text)}</div></div>`; }
function errorState(e, retry) {
  return `<div class="card"><div class="notice bad"><b>無法載入資料</b>（${esc(e.code || 'ERROR')}）：${esc(e.message || e)}</div>
    ${retry ? '<button class="btn" data-act="retry">' + svg('refresh', 16) + '重試</button>' : ''}</div>`;
}
function skeleton() {
  return `<div class="kpis">${Array(10).fill('<div class="card kpi"><div class="skeleton" style="height:70px"></div></div>').join('')}</div>
    <div class="grid"><div class="card col-8"><div class="skeleton" style="height:300px"></div></div><div class="card col-4"><div class="skeleton" style="height:300px"></div></div></div>`;
}
function openModal(html, opts) {
  const root = $('#modalRoot');
  const prev = document.activeElement;
  root.innerHTML = `<div class="overlay" role="presentation"><div class="modal ${opts && opts.size || ''}" role="dialog" aria-modal="true" aria-labelledby="mTitle">${html}</div></div>`;
  const overlay = root.firstElementChild;
  const close = () => { root.innerHTML = ''; document.removeEventListener('keydown', onKey); if (prev && prev.focus) prev.focus(); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  overlay.addEventListener('mousedown', e => { if (e.target === overlay) close(); });
  overlay.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  const first = overlay.querySelector('input:not([readonly]),select,textarea,button.primary');
  if (first) setTimeout(() => first.focus(), 30);
  return { el: overlay, close };
}
function confirmDialog(title, text, okLabel) {
  return new Promise(resolve => {
    const m = openModal(`<div class="modal-h"><h2 id="mTitle">${esc(title)}</h2></div>
      <div class="modal-b" style="display:block"><p style="margin:0">${esc(text)}</p></div>
      <div class="modal-f"><button class="btn" data-close>取消</button><button class="btn primary" id="cOk">${esc(okLabel || '確定')}</button></div>`, { size: 'sm' });
    m.el.querySelector('#cOk').addEventListener('click', () => { m.close(); resolve(true); });
    m.el.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => resolve(false)));
  });
}

/* ------------------------------ Sidebar & routing ------------------------------ */
function renderNav() {
  const badges = (S.dash && S.dash.badges) || {};
  const perms = S.boot ? S.boot.permissions : {};
  $('#nav').innerHTML = NAV.map(sec => {
    const items = sec.items.filter(it => !it.table || !perms[it.table] || perms[it.table].read);
    if (!items.length) return '';
    return `<div class="nav-section">${esc(sec.section)}</div>` + items.map(it => {
      const b = it.badge && badges[it.badge] ? `<span class="badge ${it.badgeCls || ''}" aria-label="${badges[it.badge]} 項待處理">${badges[it.badge]}</span>` : '';
      return `<button class="nav-item" data-page="${it.key}" ${S.page === it.key ? 'aria-current="page"' : ''} title="${esc(it.label)}">${svg(it.icon)}<span class="label">${esc(it.label)}</span>${b}</button>`;
    }).join('');
  }).join('');
}
function go(page, filter) {
  S.page = page;
  S.pendingFilter = filter || null;
  S.charts.forEach(c => c.destroy()); S.charts = [];
  const item = NAV_FLAT.find(i => i.key === page) || NAV_FLAT[0];
  $('#pageTitle').textContent = item.label;
  renderNav();
  closeDrawer();
  if (page === 'dashboard' || page === 'mobile') loadDashboard();
  else renderTablePage(item);
  $('#view').focus({ preventScroll: true });
  window.scrollTo(0, 0);
}
function closeDrawer() { $('#sidebar').classList.remove('open'); $('#backdrop').classList.remove('show'); $('#menuToggle').setAttribute('aria-expanded', 'false'); }

/* ------------------------------ Dashboard ------------------------------ */
async function loadDashboard(force) {
  const view = $('#view');
  if (!S.dash || force) view.innerHTML = skeleton();
  try {
    S.dash = await api('getDashboardData', S.projectId, S.filters);
    renderNav();
    S.page === 'mobile' ? renderMobile(S.dash) : renderDashboard(S.dash);
  } catch (e) {
    view.innerHTML = errorState(e, true);
    view.querySelector('[data-act="retry"]').addEventListener('click', () => loadDashboard(true));
  }
}

function kpiCard(label, value, foot, icon, nav, tone2) {
  const tag = nav ? 'button' : 'div';
  return `<${tag} class="card kpi ${nav ? 'clickable' : ''}" ${nav ? `data-go="${nav}"` : ''}>
    <div class="k-label"><span>${esc(label)}</span><span class="k-icon">${svg(icon, 16)}</span></div>
    <div class="k-value" ${tone2 ? `style="color:var(--${tone2}-ink)"` : ''}>${value}</div><div class="k-foot">${foot}</div></${tag}>`;
}

    <div class="actions">

      <div class="qa" style="display:flex;gap:6px;flex-wrap:wrap">
        ${[['WBS', 'Task'], ['Issues', 'Issue'], ['Risks', 'Risk'], ['Communications', 'Meeting'], ['Changes', 'Change Request']].filter(x => canW(x[0]))

      </div>
    </div>
  </div>
  ${dashFilters(d)}
  ${d.weightMode === 'equal' ? '<div class="notice warn">工作包未設定權重，完成率採「等權重」計算。</div>' : ''}
  <div class="kpis">
    ${kpiCard('整體完成率', fmtPct(k.completionPct), '加權（含進行中進度）', 'trend', 'wbs')}

function timelineHtml(d) {
  if (!d.timeline.length) return emptyState('未來 21 天沒有到期的交付成果', 'gantt');
  const start = d.statusDate, span = 21;
  const pos = s => { const n = (Date.parse(s) - Date.parse(start)) / 86400000; return Math.max(0, Math.min(100, n / span * 100)); };
  return `<div class="tl">${d.timeline.map(t => {
    const l = pos(t.start), r = pos(t.end) + (100 / span);
    return `<div class="tl-row"><button class="li-btn" data-open="WBS|${esc(t.id)}" style="display:block"><b>${esc(t.code)}</b> ${esc(t.name)}<div style="color:var(--muted)">${esc(t.owner)}</div></button>
      <div class="tl-track" title="${esc(t.start)} → ${esc(t.end)}"><div class="tl-bar ${esc(t.status)}" style="left:${l}%;width:${Math.max(4, r - l)}%">${esc(md(t.start))}–${esc(md(t.end))}｜${esc(t.status)}</div></div></div>`;
  }).join('')}</div><div class="legend"><span>狀態日 ${esc(start)} 起 21 天</span></div>`;
}

function riskMatrixHtml(d) {
  const cls = s => s >= 20 ? 'c' : s >= 15 ? 'h' : s >= 8 ? 'm' : 'l';
  let h = '<div class="heatmap" role="grid" aria-label="風險熱力圖">';
  d.risks.matrix.forEach(row => {
    h += `<div class="ax">P${row[0].p}</div>`;
    row.forEach(c => { h += `<button class="cell ${cls(c.score)} ${c.count ? '' : 'zero'}" data-risk="${c.p}|${c.i}" aria-label="機率 ${c.p}、影響 ${c.i}，分數 ${c.score}，${c.count} 項風險">${c.count || '·'}</button>`; });
  });
  h += '<div></div>' + [1, 2, 3, 4, 5].map(i => `<div class="ax">I${i}</div>`).join('') + '</div>';
  h += `<div class="legend"><span><i class="sq" style="background:#DCFCE7"></i>Low &lt;8</span><span><i class="sq" style="background:#FEF3C7"></i>Medium 8–14</span><span><i class="sq" style="background:#FED7AA"></i>High 15–19</span><span><i class="sq" style="background:#FECACA"></i>Critical ≥20</span></div>`;
  if (d.risks.top.length) h += `<div class="list" style="margin-top:8px">${d.risks.top.slice(0, 3).map(r => `<button class="li li-btn" data-open="Risks|${esc(r.id)}"><div class="grow"><div class="t">${esc(r.desc)}</div><div class="s">${esc(r.owner)}</div></div><span class="pill ${tone(r.severity)}">${r.score}</span></button>`).join('')}</div>`;
  return h;
}

function bindDashboard(d) {
  const v = $('#view');
  v.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.go;
    if (t === 'overdue') go('wbs', { ids: d.overdueList.map(x => x.id), label: '逾期工作包' });
    else go(t);
  }));
  v.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => { const [t, id] = b.dataset.open.split('|'); openRecord(t, id); }));
  v.querySelectorAll('[data-new]').forEach(b => b.addEventListener('click', () => openForm(b.dataset.new, null, () => loadDashboard())));
  v.querySelectorAll('[data-risk]').forEach(b => b.addEventListener('click', () => {
    const [p, i] = b.dataset.risk.split('|').map(Number);
    go('risks', { fn: r => Number(r.probability) === p && Number(r.impact) === i && r.status !== 'Closed', label: `機率 ${p} × 影響 ${i}` });
  }));
  const fp = $('#fProject');
  if (fp) fp.addEventListener('change', () => { S.projectId = fp.value; loadDashboard(true); });
  const apply = () => { S.filters = { statusDate: $('#fStatus').value, from: $('#fFrom').value, to: $('#fTo').value }; loadDashboard(true); };
  $('#fApply') && $('#fApply').addEventListener('click', apply);
  $('#fRefresh') && $('#fRefresh').addEventListener('click', () => loadDashboard(true));
  $('#exportBtn') && $('#exportBtn').addEventListener('click', () => {
    const k = d.kpis;
    downloadCsv('kpi_' + d.statusDate + '.csv', [['指標', '數值'], ['狀態日', d.statusDate], ['整體完成率%', k.completionPct], ['WBS 工作包', k.totalWorkPackages],
      ['已完成', k.completedWorkPackages], ['逾期', k.overdueTasks], ['計畫預算', k.plannedBudget], ['實際成本', k.actualCost], ['預算使用率%', k.budgetUtilizationPct],
      ['未結問題', k.openIssues], ['高風險', k.highRisks], ['近期里程碑', k.upcomingMilestones], ['計畫%（狀態日）', d.sCurve.plannedAtStatus],
      ['實際%（狀態日）', d.sCurve.actualAtStatus], ['CPI', d.evm.CPI === null ? 'N/A' : d.evm.CPI], ['SPI', d.evm.SPI === null ? 'N/A' : d.evm.SPI], ['健康度', d.health.overall]]);
  });
  $('#snapBtn') && $('#snapBtn').addEventListener('click', async () => {
    if (!await confirmDialog('產生本週快照', '快照建立後不可覆寫，確定以目前資料建立本週（週五）快照？', '建立快照')) return;
    try { const s = await api('createWeeklySnapshot', S.projectId); toast('已建立快照 ' + s.week_ending, 'ok'); loadDashboard(); }
    catch (e) { toast(errMsg(e), 'err'); }
  });
}

/* ------------------------------ Charts ------------------------------ */
function chartDefaults() {
  if (typeof Chart === 'undefined') return false;
  Chart.defaults.font.family = cssVar('--font') || 'sans-serif';
  Chart.defaults.font.size = 12;
  Chart.defaults.color = cssVar('--chart-axis');
  Chart.defaults.plugins.legend.display = false;
  Chart.defaults.maintainAspectRatio = false;
  Chart.defaults.plugins.tooltip.backgroundColor = '#0F172A';
  Chart.defaults.plugins.tooltip.padding = 10;
  Chart.defaults.plugins.tooltip.cornerRadius = 8;
  return true;
}
const grid = () => ({ color: cssVar('--chart-grid'), drawTicks: false });
const statusLine = idx => ({
  id: 'statusLine',
  afterDatasetsDraw(chart) {
    if (idx < 0) return;
    const x = chart.scales.x.getPixelForValue(idx), { top, bottom } = chart.chartArea, c = chart.ctx;
    c.save(); c.strokeStyle = cssVar('--text'); c.lineWidth = 1.5; c.setLineDash([3, 3]);
    c.beginPath(); c.moveTo(x, top); c.lineTo(x, bottom); c.stroke();
    c.setLineDash([]); c.fillStyle = cssVar('--text'); c.font = '600 11px ' + (cssVar('--font') || 'sans-serif');
    c.fillText('狀態日', Math.min(x + 4, chart.chartArea.right - 40), top + 12); c.restore();
  }
});
function addChart(id, cfg) {
  const el = document.getElementById(id);
  if (!el) return;
  S.charts.push(new Chart(el, cfg));
}
function drawDashboardCharts(d) {
  if (!chartDefaults()) { document.querySelectorAll('.chart-box').forEach(b => b.innerHTML = emptyState('圖表元件（Chart.js）無法載入，請檢查網路。')); return; }
  const sc = d.sCurve, C = i => cssVar('--s' + i), base = cssVar('--chart-baseline');
  const pctAxis = { min: 0, max: 100, grid: grid(), border: { display: false }, ticks: { callback: v => v + '%', stepSize: 25 } };
  const idx = sc.labels.indexOf(d.statusDate);

/* ------------------------------ Table pages ------------------------------ */
async function loadTable(table, force) {
  if (S.cache[table] && !force) return S.cache[table];
  const rows = await api('listRecords', table, table === 'AuditLogs' ? null : S.projectId, table === 'AuditLogs' ? { limit: 500 } : {});
  S.cache[table] = rows || [];
  return S.cache[table];
}
function tableState(key, table) {
  if (!S.table[key]) {
    const sch = S.boot.schema[table];
    const visible = DEFAULT_COLS[table] || sch.fields.filter(f => !f.system).slice(0, 8).map(f => f.name);
    S.table[key] = { q: '', sort: table === 'WBS' ? 'wbs_code' : null, dir: 1, page: 1, size: 20, visible, enumFilter: '', collapsed: {} };
  }
  return S.table[key];
}
async function renderTablePage(item) {

  catch (e) { view.innerHTML = errorState(e, true); view.querySelector('[data-act="retry"]').addEventListener('click', () => renderTablePage(item)); return; }
  if (S.page !== item.key) return;
  const st = tableState(item.key, table);
  const perm = S.boot.permissions[table] || {};
  const enumField = sch.fields.find(f => f.type === 'enum' && /status|result|severity|responsibility/.test(f.name));
  const phaseNote = item.phase ? `<div class="notice">完整的「${esc(item.label)}」視圖（${item.key === 'gantt' ? '甘特圖' : item.key === 'raci' ? '矩陣檢視與 A/R 缺漏檢查' : '活動當日即時時序表'}）規劃於第 ${item.phase} 階段交付；目前提供可讀寫的資料表檢視。</div>` : '';
  view.innerHTML = `${phaseNote}
  ${S.pendingFilter ? `<div class="notice">已套用篩選：${esc(S.pendingFilter.label || '')} <button class="btn sm" id="clearPF" style="margin-left:8px">清除</button></div>` : ''}
  <div class="card">
    <div class="card-h"><h2>${esc(sch.label)}</h2><span class="sub">${esc(sch.code)}｜工作表 ${esc(table)}</span><span class="spacer"></span>
      ${table === 'WBS' && S.boot.permissions._baseline ? '<button class="btn sm" id="baselineBtn">核准基準</button>' : ''}</div>
    <div class="table-tools">
      <div class="field" style="flex:1;min-width:180px"><label for="tq" class="sr-only">搜尋</label><input id="tq" class="input" type="search" placeholder="搜尋此表…" value="${esc(st.q)}"></div>
      ${enumField ? `<div class="field"><label for="tf" class="sr-only">${esc(enumField.label)}</label><select id="tf" class="input"><option value="">全部${esc(enumField.label)}</option>${S.boot.enums[enumField.enumKey].map(v => `<option ${st.enumFilter === v ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></div>` : ''}
      <div style="position:relative"><button class="btn" id="colBtn" aria-haspopup="true">${svg('cols', 16)}欄位</button></div>
      <button class="btn" id="csvBtn">${svg('download', 16)}CSV</button>
      <button class="btn" id="reloadBtn" aria-label="重新整理">${svg('refresh', 16)}</button>
      ${perm.write && !sch.immutable && table !== 'AuditLogs' ? `<button class="btn primary" id="addBtn">${svg('plus', 16)}新增</button>` : ''}
    </div>
    <div id="tbody"></div>
  </div>`;
  const draw = () => drawTable(item, rows, enumField);
  $('#tq').addEventListener('input', debounce(e => { st.q = e.target.value; st.page = 1; draw(); }, 200));
  $('#tf') && $('#tf').addEventListener('change', e => { st.enumFilter = e.target.value; st.page = 1; draw(); });
  $('#reloadBtn').addEventListener('click', () => renderTablePage(item));
  $('#addBtn') && $('#addBtn').addEventListener('click', () => openForm(table, null, () => renderTablePage(item), item.preset));
  $('#clearPF') && $('#clearPF').addEventListener('click', () => { S.pendingFilter = null; renderTablePage(item); });
  $('#csvBtn').addEventListener('click', () => {
    const data = filtered(item, rows, enumField), cols = st.visible;
    downloadCsv(table + '_' + todayStr() + '.csv', [cols.map(c => (S.boot.schema[table].fields.find(f => f.name === c) || {}).label || c)].concat(data.map(r => cols.map(c => r[c]))));
  });
  $('#colBtn').addEventListener('click', e => columnMenu(e.currentTarget, item, draw));
  $('#baselineBtn') && $('#baselineBtn').addEventListener('click', approveBaselineFlow);
  draw();
}
function filtered(item, rows, enumField) {
  const st = S.table[item.key], q = st.q.trim().toLowerCase();
  let out = rows.slice();
  if (item.preset) out = out.filter(r => Object.keys(item.preset).every(k => String(r[k]) === String(item.preset[k])));
  if (S.pendingFilter) {
    if (S.pendingFilter.ids) out = out.filter(r => S.pendingFilter.ids.includes(r[S.boot.schema[item.table].key]));
    if (S.pendingFilter.fn) out = out.filter(S.pendingFilter.fn);
  }
  if (enumField && st.enumFilter) out = out.filter(r => r[enumField.name] === st.enumFilter || r.effective_status === st.enumFilter);
  if (q) out = out.filter(r => Object.keys(r).some(k => String(r[k]).toLowerCase().includes(q) || (RES_FIELDS.includes(k) && resName(r[k]).toLowerCase().includes(q))));
  if (st.sort) {
    const natural = (a, b) => String(a).localeCompare(String(b), 'zh-Hant', { numeric: true });
    out.sort((a, b) => { const x = a[st.sort], y = b[st.sort];
      if (typeof x === 'number' && typeof y === 'number') return (x - y) * st.dir;
      return natural(x === undefined ? '' : x, y === undefined ? '' : y) * st.dir; });
  }
  // WBS 樹狀收合：無搜尋／篩選時套用
  if (item.table === 'WBS' && !item.preset && !q && !S.pendingFilter && !st.enumFilter && st.sort === 'wbs_code') {
    const hidden = id => { let r = rows.find(x => x.wbs_id === id); let g = 0;
      while (r && r.parent_wbs_id && g++ < 10) { if (st.collapsed[r.parent_wbs_id]) return true; r = rows.find(x => x.wbs_id === r.parent_wbs_id); } return false; };
    out = out.filter(r => !hidden(r.wbs_id));
  }
  return out;
}
function cellHtml(table, f, r, canWrite) {
  const v = r[f.name];
  if (!f) return '';
  if (canWrite && f.type === 'enum' && !f.system && !(DERIVED[table] || []).includes(f.name) && S.boot.schema[table].key !== f.name) {
    return `<label class="sr-only" for="ie-${esc(r[S.boot.schema[table].key])}-${f.name}">${esc(f.label)}</label><select class="inline" id="ie-${esc(r[S.boot.schema[table].key])}-${f.name}" data-inline="${f.name}" data-id="${esc(r[S.boot.schema[table].key])}">${S.boot.enums[f.enumKey].map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  }
  if (table === 'WBS' && f.name === 'status' && r.effective_status && r.effective_status !== v) return pill(r.effective_status) + ` <span style="font-size:11px;color:var(--muted)">（表內：${esc(v)}）</span>`;
  if (f.type === 'enum') return pill(v);
  if (f.type === 'money') return v === '' ? '' : fmtMoney(v);
  if (f.type === 'pct') return v === '' ? '' : fmtPct(table === 'WBS' && f.name === 'percent_complete' && !r.is_leaf ? r.rollup_percent : v);
  if (f.type === 'bool') return v ? '是' : '否';
  if (f.type === 'url') return v ? `<a href="${esc(v)}" target="_blank" rel="noopener noreferrer">開啟</a>` : '';
  if (RES_FIELDS.includes(f.name) && !(table === 'Resources' && f.name === 'resource_id')) return esc(resName(v));
  if (f.type === 'refs') return esc(String(v).split(',').join(', '));
  return `<span class="clip">${esc(v)}</span>`;
}
function drawTable(item, rows, enumField) {
  const table = item.table, st = S.table[item.key], sch = S.boot.schema[table];
  const perm = S.boot.permissions[table] || {};
  const canWrite = perm.write && !sch.immutable && table !== 'AuditLogs';
  const data = filtered(item, rows, enumField);
  const pages = Math.max(1, Math.ceil(data.length / st.size));
  st.page = Math.min(st.page, pages);
  const slice = data.slice((st.page - 1) * st.size, st.page * st.size);
  const fields = st.visible.map(n => sch.fields.find(f => f.name === n)).filter(Boolean);
  const key = sch.key;
  const box = $('#tbody');
  if (!data.length) { box.innerHTML = emptyState(rows.length ? '沒有符合條件的資料' : '此表尚無資料'); return; }
  const isTree = table === 'WBS' && st.sort === 'wbs_code' && !item.preset;
  box.innerHTML = `<div class="table-wrap"><table class="data"><caption class="sr-only">${esc(sch.label)}</caption><thead><tr>
    ${fields.map(f => `<th scope="col" aria-sort="${st.sort === f.name ? (st.dir > 0 ? 'ascending' : 'descending') : 'none'}"><button data-sort="${f.name}">${esc(f.label)}${st.sort === f.name ? (st.dir > 0 ? ' ▲' : ' ▼') : ''}</button></th>`).join('')}
    <th scope="col"><span class="sr-only">操作</span></th></tr></thead><tbody>
    ${slice.map(r => `<tr>${fields.map((f, i) => {
      let inner = cellHtml(table, f, r, canWrite);
      if (isTree && i === 0) {
        const lv = Number(r.level) || 1;
        const tog = r.child_count ? `<button class="btn sm" style="height:24px;padding:0 4px;border:0" data-tog="${esc(r.wbs_id)}" aria-expanded="${!st.collapsed[r.wbs_id]}" aria-label="${st.collapsed[r.wbs_id] ? '展開' : '收合'} ${esc(r.wbs_code)}">${svg(st.collapsed[r.wbs_id] ? 'chev' : 'chevd', 14)}</button>` : '<span style="display:inline-block;width:24px"></span>';
        inner = `<span class="tree-indent" style="width:${(lv - 1) * 18}px"></span>${tog}<b>${esc(r.wbs_code)}</b>`;
      }
      return `<td class="${['money', 'num', 'int', 'pct'].includes(f.type) ? 'num' : ''}">${inner}</td>`;
    }).join('')}<td><button class="btn sm" data-edit="${esc(r[key])}">${canWrite ? '編輯' : '檢視'}</button></td></tr>`).join('')}
    </tbody></table></div>
    <div class="cards-view">${slice.map(r => `<button class="rcard" data-edit="${esc(r[key])}">${fields.slice(0, 6).map(f => `<div class="kv"><span>${esc(f.label)}</span><span>${f.type === 'enum' ? pill(r[f.name]) : cellHtml(table, f, r, false)}</span></div>`).join('')}</button>`).join('')}</div>
    <div class="pager"><span>共 ${data.length} 筆｜第 ${st.page} / ${pages} 頁</span>
      <button class="btn sm" data-pg="-1" ${st.page <= 1 ? 'disabled' : ''}>上一頁</button><button class="btn sm" data-pg="1" ${st.page >= pages ? 'disabled' : ''}>下一頁</button></div>`;
  box.querySelectorAll('[data-sort]').forEach(b => b.addEventListener('click', () => { const s = b.dataset.sort; st.dir = st.sort === s ? -st.dir : 1; st.sort = s; drawTable(item, rows, enumField); }));
  box.querySelectorAll('[data-pg]').forEach(b => b.addEventListener('click', () => { st.page += Number(b.dataset.pg); drawTable(item, rows, enumField); }));
  box.querySelectorAll('[data-tog]').forEach(b => b.addEventListener('click', () => { st.collapsed[b.dataset.tog] = !st.collapsed[b.dataset.tog]; drawTable(item, rows, enumField); }));
  box.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => { const r = rows.find(x => String(x[key]) === b.dataset.edit); openForm(table, r, () => renderTablePage(item)); }));
  box.querySelectorAll('[data-inline]').forEach(sel => sel.addEventListener('change', async () => {
    const r = rows.find(x => String(x[key]) === sel.dataset.id), field = sel.dataset.inline, prev = r[field];
    sel.disabled = true;
    try {
      const saved = await api('updateRecord', table, r[key], { [field]: sel.value, row_version: r.row_version });
      Object.assign(r, saved); toast('已更新「' + (sch.fields.find(f => f.name === field) || {}).label + '」', 'ok'); S.dash = null;
      if (saved[field] !== sel.value) drawTable(item, rows, enumField);
    } catch (e) { sel.value = prev; toast(errMsg(e), 'err'); }
    sel.disabled = false;
  }));
}
function columnMenu(btn, item, draw) {
  const old = document.querySelector('.col-menu'); if (old) { old.remove(); return; }
  const st = S.table[item.key], sch = S.boot.schema[item.table];
  const m = document.createElement('div'); m.className = 'col-menu'; m.setAttribute('role', 'menu');
  m.innerHTML = sch.fields.filter(f => f.name !== 'is_deleted').map(f => `<label><input type="checkbox" value="${f.name}" ${st.visible.includes(f.name) ? 'checked' : ''}>${esc(f.label)}</label>`).join('');
  btn.parentElement.appendChild(m);
  m.addEventListener('change', e => { const n = e.target.value; st.visible = e.target.checked ? sch.fields.map(f => f.name).filter(x => st.visible.includes(x) || x === n) : st.visible.filter(x => x !== n); draw(); });
  setTimeout(() => document.addEventListener('click', function h(ev) { if (!m.contains(ev.target) && ev.target !== btn) { m.remove(); document.removeEventListener('click', h); } }), 0);
}

/* ------------------------------ Forms ------------------------------ */
async function openRecord(table, id) {
  try { const rows = await loadTable(table, true); const r = rows.find(x => String(x[S.boot.schema[table].key]) === String(id)); if (r) openForm(table, r, () => S.page === 'dashboard' ? loadDashboard() : go(S.page)); else toast('找不到資料', 'err'); }
  catch (e) { toast(errMsg(e), 'err'); }
}
function inputFor(table, f, val, ro) {
  const id = 'f_' + f.name, dis = ro ? 'disabled' : '', req = f.required ? 'required aria-required="true"' : '';
  const v = val === undefined || val === null ? '' : val;
  if (f.type === 'enum') return `<select id="${id}" name="${f.name}" class="input" ${dis} ${req}><option value="">—</option>${S.boot.enums[f.enumKey].map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  if (RES_FIELDS.includes(f.name) && S.boot.resources.length && !(table === 'Resources')) return `<select id="${id}" name="${f.name}" class="input" ${dis} ${req}><option value="">—</option>${S.boot.resources.map(r => `<option value="${esc(r.id)}" ${r.id === v ? 'selected' : ''}>${esc(r.id + '｜' + r.name)}</option>`).join('')}${v && !S.boot.resources.some(r => r.id === v) ? `<option selected value="${esc(v)}">${esc(v)}</option>` : ''}</select>`;
  if (f.type === 'text' || f.type === 'json') return `<textarea id="${id}" name="${f.name}" class="input" ${dis} ${req} maxlength="5000">${esc(v)}</textarea>`;
  if (f.type === 'bool') return `<select id="${id}" name="${f.name}" class="input" ${dis}><option value="false" ${!v ? 'selected' : ''}>否</option><option value="true" ${v ? 'selected' : ''}>是</option></select>`;
  const type = { date: 'date', int: 'number', num: 'number', money: 'number', pct: 'number', email: 'email', url: 'url', time: 'time' }[f.type] || 'text';
  const extra = f.type === 'pct' ? 'min="0" max="100" step="0.1"' : f.type === 'money' ? 'min="0" step="1"' : f.type === 'int' ? 'step="1"' : f.type === 'num' ? 'step="any"' : '';
  const ph = f.type === 'datetime' ? 'placeholder="YYYY-MM-DD HH:mm"' : f.type === 'refs' ? 'placeholder="以逗號分隔 ID"' : (f.type === 'id' ? 'placeholder="留空自動產生"' : '');
  return `<input id="${id}" name="${f.name}" class="input" type="${type}" ${extra} ${ph} ${dis} ${f.type === 'id' ? '' : req} value="${esc(v)}" maxlength="${f.type === 'text' ? 5000 : 300}">`;
}
function openForm(table, rec, onSaved, preset) {
  const sch = S.boot.schema[table], perm = S.boot.permissions[table] || {};
  const canWrite = perm.write && !sch.immutable && table !== 'AuditLogs';
  const isNew = !rec;
  const hidden = (DERIVED[table] || []).concat(DERIVED._all).concat(['project_id']);
  const fields = sch.fields.filter(f => !f.system && (isNew ? !hidden.includes(f.name) : true));
  const init = rec || Object.assign({}, preset || {}, table === 'Issues' ? { created_date: todayStr(), status: 'Open' } : {}, table === 'WBS' ? { status: 'Not Started', percent_complete: 0 } : {},
    table === 'Risks' ? { status: 'Open' } : {}, table === 'Communications' ? { meeting_status: 'Scheduled' } : {}, table === 'Changes' ? { implementation_status: 'Draft', request_date: todayStr() } : {},
    table === 'Acceptance' ? { result: 'Pending' } : {});
  const ro = f => !canWrite || (!isNew && (f.name === sch.key || f.name === 'project_id')) || (!isNew && (hidden.includes(f.name) || f.type === 'json'));
  const m = openModal(`<form id="recForm" novalidate>
    <div class="modal-h"><h2 id="mTitle">${isNew ? '新增' : canWrite ? '編輯' : '檢視'}｜${esc(sch.label)}</h2><button type="button" class="icon-btn" data-close aria-label="關閉">${svg('x', 16)}</button></div>
    <div class="modal-b">
      <div class="full notice bad" id="formErr" hidden></div>
      ${!isNew && rec.approved_at && table === 'WBS' ? `<div class="full notice warn">此工作已核准基準（${esc(rec.baseline_version)}），基準欄位需透過變更請求修改。</div>` : ''}
      ${fields.map(f => `<div class="field ${f.type === 'text' || f.type === 'json' ? 'full' : ''}"><label for="f_${f.name}">${esc(f.label)} ${f.required && f.type !== 'id' ? '<span class="req" aria-hidden="true">*</span>' : ''}<span style="color:var(--muted);font-weight:400"> ${esc(f.name)}</span></label>
        ${inputFor(table, f, init[f.name], ro(f))}<div class="err" id="e_${f.name}"></div></div>`).join('')}
      ${!isNew ? `<div class="full" style="font-size:12px;color:var(--muted)">版本 ${esc(rec.row_version)}｜更新 ${esc(rec.updated_at || '')}</div>` : ''}
    </div>
    <div class="modal-f">
      ${!isNew && canWrite && perm.del ? '<button type="button" class="btn danger left" id="delBtn">刪除</button>' : ''}
      ${!isNew && table === 'Risks' && canWrite && !rec.linked_issue_id ? '<button type="button" class="btn left" id="toIssue">轉為問題</button>' : ''}
      <button type="button" class="btn" data-close>${canWrite ? '取消' : '關閉'}</button>
      ${canWrite ? '<button type="submit" class="btn primary" id="saveBtn">儲存</button>' : ''}
    </div></form>`);
  const form = m.el.querySelector('#recForm');
  const showErr = msg => { const e = form.querySelector('#formErr'); e.hidden = false; e.textContent = msg; e.scrollIntoView({ block: 'nearest' }); };
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    form.querySelectorAll('.err').forEach(e => e.textContent = ''); form.querySelectorAll('[aria-invalid]').forEach(e => e.removeAttribute('aria-invalid'));
    const payload = {}; let bad = false;
    fields.forEach(f => {
      const el = form.elements[f.name]; if (!el || el.disabled) return;
      let v = el.value.trim();
      if (f.type === 'bool') v = v === 'true';
      if (f.required && f.type !== 'id' && v === '') { bad = true; el.setAttribute('aria-invalid', 'true'); form.querySelector('#e_' + f.name).textContent = '必填'; }
      if (['int', 'num', 'money', 'pct'].includes(f.type) && v !== '' && !isFinite(Number(v))) { bad = true; el.setAttribute('aria-invalid', 'true'); form.querySelector('#e_' + f.name).textContent = '需為數字'; }
      if (f.type === 'pct' && v !== '' && (Number(v) < 0 || Number(v) > 100)) { bad = true; el.setAttribute('aria-invalid', 'true'); form.querySelector('#e_' + f.name).textContent = '0–100'; }
      if ((f.name === 'probability' || f.name === 'impact') && v !== '' && !/^[1-5]$/.test(v)) { bad = true; el.setAttribute('aria-invalid', 'true'); form.querySelector('#e_' + f.name).textContent = '1–5 整數'; }
      if (isNew && f.type === 'id' && v === '') return;
      payload[f.name] = v;
    });
    if (bad) { showErr('請修正標示的欄位'); return; }
    const btn = form.querySelector('#saveBtn'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>儲存中…';
    try {
      if (isNew) await api('createRecord', table, Object.assign({ project_id: S.projectId }, payload));
      else await api('updateRecord', table, rec[sch.key], Object.assign(payload, { row_version: rec.row_version }));
      toast('已儲存至 Google Sheets', 'ok'); S.dash = null; delete S.cache[table]; m.close(); onSaved && onSaved();
    } catch (e) { showErr(errMsg(e)); btn.disabled = false; btn.textContent = '儲存'; } // 失敗保留輸入
  });
  const del = form.querySelector('#delBtn');
  del && del.addEventListener('click', async () => {
    if (!await confirmDialog('確認刪除', '此筆資料將標記為已刪除（Soft Delete），可由管理員復原。確定刪除？', '刪除')) return;
    try { await api('deleteRecord', table, rec[sch.key], rec.row_version); toast('已刪除', 'ok'); S.dash = null; m.close(); onSaved && onSaved(); }
    catch (e) { toast(errMsg(e), 'err'); }
  });
  const ti = form.querySelector('#toIssue');
  ti && ti.addEventListener('click', async () => {
    try { const is = await api('convertRiskToIssue', rec.risk_id); toast('已建立問題 ' + is.issue_id + '，並保留風險關聯', 'ok'); S.dash = null; m.close(); onSaved && onSaved(); }
    catch (e) { toast(errMsg(e), 'err'); }
  });
}
async function approveBaselineFlow() {
  const m = openModal(`<div class="modal-h"><h2 id="mTitle">核准 WBS 基準</h2></div><div class="modal-b" style="display:block">
    <p style="margin-top:0">核准後，計畫日期、權重、交付成果與驗收標準將鎖定，只能透過核准的變更請求修改。</p>
    <div class="field"><label for="bv">基準版本（如 v1、v1.1）</label><input id="bv" class="input" value="v1"></div></div>
    <div class="modal-f"><button class="btn" data-close>取消</button><button class="btn primary" id="bOk">核准</button></div>`, { size: 'sm' });
  m.el.querySelector('#bOk').addEventListener('click', async () => {
    try { const r = await api('approveBaseline', S.projectId, m.el.querySelector('#bv').value.trim()); toast(`已核准基準 ${r.version}（${r.count} 項）`, 'ok'); m.close(); S.dash = null; go('wbs'); }
    catch (e) { toast(errMsg(e), 'err'); }
  });
}

/* ------------------------------ CSV ------------------------------ */
function downloadCsv(name, rows) {
  const cell = v => { let s = v === null || v === undefined ? '' : String(v); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const blob = new Blob(['﻿' + rows.map(r => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ------------------------------ Global search & notifications ------------------------------ */
async function globalSearch(q) {
  q = q.trim().toLowerCase(); if (!q) return;
  const tables = ['WBS', 'Issues', 'Risks', 'Milestones'].filter(t => S.boot.permissions[t] && S.boot.permissions[t].read);
  try {
    const results = [];
    for (const t of tables) {
      const rows = await loadTable(t);
      rows.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(q))).slice(0, 8).forEach(r => results.push({ t, r }));
    }
    const label = r => r.task_name || r.title || r.risk_description || r.milestone_name;
    const m = openModal(`<div class="modal-h"><h2 id="mTitle">搜尋「${esc(q)}」</h2><button class="icon-btn" data-close aria-label="關閉">${svg('x', 16)}</button></div>
      <div class="modal-b" style="display:block">${results.length ? `<div class="list">${results.map(x => `<button class="li li-btn" data-o="${esc(x.t)}|${esc(x.r[S.boot.schema[x.t].key])}"><div class="grow"><div class="t">${esc(label(x.r))}</div><div class="s">${esc(S.boot.schema[x.t].label)}｜${esc(x.r[S.boot.schema[x.t].key])}</div></div></button>`).join('')}</div>` : emptyState('找不到符合的資料')}</div>`);
    m.el.querySelectorAll('[data-o]').forEach(b => b.addEventListener('click', () => { const [t, id] = b.dataset.o.split('|'); m.close(); openRecord(t, id); }));
  } catch (e) { toast(errMsg(e), 'err'); }
}
function showNotifications() {
  const r = (S.dash && S.dash.reminders) || [];
  openModal(`<div class="modal-h"><h2 id="mTitle">通知</h2><button class="icon-btn" data-close aria-label="關閉">${svg('x', 16)}</button></div>
    <div class="modal-b" style="display:block">${r.length ? `<div class="list">${r.map(x => `<div class="li"><div class="grow"><div class="t">${esc(x.title)}</div><div class="s">${esc(x.kind)}｜${esc(x.date)}｜${esc(x.owner)}</div></div></div>`).join('')}</div>` : emptyState('沒有新通知', 'check')}</div>`, { size: 'sm' });
}

/* ------------------------------ Init ------------------------------ */
function bindShell() {
  $('#nav').addEventListener('click', e => { const b = e.target.closest('[data-page]'); if (b) go(b.dataset.page); });
  $('#menuToggle').addEventListener('click', () => { const sb = $('#sidebar'); const open = !sb.classList.contains('open'); sb.classList.toggle('open', open); $('#backdrop').classList.toggle('show', open); $('#menuToggle').setAttribute('aria-expanded', String(open)); });
  $('#backdrop').addEventListener('click', closeDrawer);
  $('#collapseBtn').addEventListener('click', () => $('#sidebar').classList.toggle('collapsed'));
  $('#themeBtn').addEventListener('click', () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', S.theme); if (S.page === 'dashboard' && S.dash) { S.charts.forEach(c => c.destroy()); S.charts = []; renderDashboard(S.dash); } });
  $('#notifBtn').addEventListener('click', showNotifications);
  $('#globalSearch').addEventListener('keydown', e => { if (e.key === 'Enter') globalSearch(e.target.value); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
}
async function init() {
  bindShell();
  renderNav();
  $('#view').innerHTML = skeleton();
  try {
    S.boot = await api('getBootstrap');
    S.projectId = S.boot.defaultProjectId;
    if (!S.boot.projects.some(p => p.id === S.projectId) && S.boot.projects.length) S.projectId = S.boot.projects[0].id;
    const u = S.boot.user;
    $('#userChip').innerHTML = `<div class="avatar" aria-hidden="true">${esc((u.name || u.email).substring(0, 1).toUpperCase())}</div><div class="who"><span>${esc(u.name || u.email)}</span><small>${esc(u.role)}</small></div>`;
    if (!S.boot.projects.length) { $('#view').innerHTML = errorState({ code: 'NO_PROJECT', message: 'Projects 工作表沒有任何專案，請先執行 setupDatabase()。' }); return; }
    go('dashboard');
  } catch (e) {
    $('#view').innerHTML = errorState(e, true);
    const r = $('#view [data-act="retry"]'); r && r.addEventListener('click', () => location.reload());
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
